[project]
name = "python-common-lib"
version = "0.1.0"
description = "Shared library for e-commerce microservices"
requires-python = ">=3.11"

[tool.poetry]
name = "python-common-lib"
version = "0.1.0"
description = "Shared library for e-commerce microservices"
packages = [{include = "shared_lib"}]

[tool.poetry.dependencies]
python = ">=3.11"
sqlalchemy = "^2.0"
pydantic = "^2.0"
pydantic-settings = "^2.0"
fastapi = "^0.110.0"
python-jose = {extras = ["cryptography"], version = "^3.3"}
passlib = {extras = ["bcrypt"], version = "^1.7"}
bcrypt = "<4.1"
python-multipart = "^0.0.6"
alembic = "^1.13.0"
aiokafka = ">=0.11.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-asyncio = "^0.23"
httpx = "^0.27"
aiosqlite = "^0.20"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
