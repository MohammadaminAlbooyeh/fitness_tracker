openapi: 3.0.0
info:
  title: Inventory Service API
  description: Inventory management microservice with stock reservation
  version: 1.0.0

servers:
  - url: http://localhost:8000/api/inventory
    description: Kong Gateway

paths:
  /inventory:
    get:
      summary: List all inventory
      operationId: listInventory
      responses:
        '200':
          description: List of inventory items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InventoryResponse'

    post:
      summary: Create inventory for a product
      operationId: createInventory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InventoryRequest'
      responses:
        '201':
          description: Inventory created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryResponse'

  /inventory/product/{productId}:
    get:
      summary: Get inventory by product ID
      operationId: getInventoryByProduct
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Inventory found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryResponse'
        '404':
          description: Inventory not found

  /inventory/{productId}/quantity:
    put:
      summary: Update inventory quantity
      operationId: updateQuantity
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                quantityChange:
                  type: integer
      responses:
        '200':
          description: Inventory updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryResponse'

  /inventory/{productId}/reserve:
    post:
      summary: Reserve stock for an order
      operationId: reserveStock
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                quantity:
                  type: integer
      responses:
        '200':
          description: Stock reserved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryResponse'

  /inventory/{productId}/release:
    post:
      summary: Release reserved stock
      operationId: releaseStock
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                quantity:
                  type: integer
      responses:
        '200':
          description: Stock released
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryResponse'

components:
  schemas:
    InventoryRequest:
      type: object
      properties:
        productId:
          type: integer
        quantity:
          type: integer
        price:
          type: number

    InventoryResponse:
      type: object
      properties:
        id:
          type: integer
        productId:
          type: integer
        quantity:
          type: integer
        reservedQuantity:
          type: integer
        price:
          type: number
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
