openapi: 3.0.0
info:
  title: Search Service API
  description: Search query logging and analytics microservice
  version: 1.0.0

servers:
  - url: http://localhost:8000/api/search
    description: Kong Gateway

paths:
  /search/queries:
    get:
      summary: Get search queries by user ID
      operationId: getQueries
      parameters:
        - name: userId
          in: query
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: List of search queries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SearchQueryResponse'

    post:
      summary: Save a search query
      operationId: saveQuery
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchQueryRequest'
      responses:
        '201':
          description: Query saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchQueryResponse'

  /search/queries/all:
    get:
      summary: Get all search queries
      operationId: getAllQueries
      responses:
        '200':
          description: List of all search queries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SearchQueryResponse'

components:
  schemas:
    SearchQueryRequest:
      type: object
      properties:
        query:
          type: string
        userId:
          type: integer

    SearchQueryResponse:
      type: object
      properties:
        id:
          type: integer
        query:
          type: string
        userId:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
