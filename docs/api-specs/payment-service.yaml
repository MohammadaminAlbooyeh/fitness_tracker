openapi: 3.0.0
info:
  title: Payment Service API
  description: Payment processing microservice
  version: 1.0.0

servers:
  - url: http://localhost:8000/api/payments
    description: Kong Gateway

paths:
  /payments:
    get:
      summary: List all payments
      operationId: listPayments
      responses:
        '200':
          description: List of payments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PaymentResponse'

    post:
      summary: Create a new payment
      operationId: createPayment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentRequest'
      responses:
        '201':
          description: Payment created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'

  /payments/{id}:
    get:
      summary: Get payment by ID
      operationId: getPayment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Payment found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
        '404':
          description: Payment not found

  /payments/{id}/status:
    put:
      summary: Update payment status
      operationId: updatePaymentStatus
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
      responses:
        '200':
          description: Payment updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'

  /payments/order/{orderId}:
    get:
      summary: Get payments by order ID
      operationId: getPaymentsByOrder
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: List of payments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PaymentResponse'

components:
  schemas:
    PaymentRequest:
      type: object
      properties:
        orderId:
          type: integer
        amount:
          type: number
        currency:
          type: string
        paymentMethod:
          type: string
        transactionId:
          type: string

    PaymentResponse:
      type: object
      properties:
        id:
          type: integer
        orderId:
          type: integer
        amount:
          type: number
        currency:
          type: string
        status:
          type: string
        paymentMethod:
          type: string
        transactionId:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
