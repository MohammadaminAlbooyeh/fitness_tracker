global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: "kong"
    static_configs:
      - targets: ["kong:8001"]

  - job_name: "postgres"
    static_configs:
      - targets: ["postgres:9187"]

  - job_name: "redis"
    static_configs:
      - targets: ["redis:9121"]

  - job_name: "user-service"
    static_configs:
      - targets: ["user-service:8000"]

  - job_name: "product-service"
    static_configs:
      - targets: ["product-service:8000"]

  - job_name: "cart-service"
    static_configs:
      - targets: ["cart-service:8000"]

  - job_name: "order-service"
    static_configs:
      - targets: ["order-service:8000"]

  - job_name: "payment-service"
    static_configs:
      - targets: ["payment-service:8081"]

  - job_name: "inventory-service"
    static_configs:
      - targets: ["inventory-service:8082"]

  - job_name: "search-service"
    static_configs:
      - targets: ["search-service:8083"]

  - job_name: "review-service"
    static_configs:
      - targets: ["review-service:8084"]

  - job_name: "seller-service"
    static_configs:
      - targets: ["seller-service:8085"]

  - job_name: "notification-service"
    static_configs:
      - targets: ["notification-service:8000"]

  - job_name: "analytics-service"
    static_configs:
      - targets: ["analytics-service:8000"]

  - job_name: "behavior-tracking-service"
    static_configs:
      - targets: ["behavior-tracking-service:8000"]

  - job_name: "recommendation-service"
    static_configs:
      - targets: ["recommendation-service:8000"]
