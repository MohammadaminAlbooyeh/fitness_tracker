image:
  repository: ecommerce
  tag: latest
  pullPolicy: IfNotPresent

replicaCount: 2

service:
  type: ClusterIP
  port: 80

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

env: {}

nodeSelector: {}

tolerations: []

affinity: {}

configMap:
  enabled: true

secretRef: ""

serviceAccount:
  create: true
  name: ""
