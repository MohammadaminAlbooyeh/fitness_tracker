apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: ecommerce-secrets
  namespace: ecommerce
spec:
  template:
    metadata:
      name: ecommerce-secrets
      namespace: ecommerce
    type: Opaque
  # Generate cluster-specific encryptedData with kubeseal before deployment.
  encryptedData:
    DATABASE_USER: REPLACE_WITH_KUBESEAL_OUTPUT
    DATABASE_PASSWORD: REPLACE_WITH_KUBESEAL_OUTPUT
    REDIS_PASSWORD: REPLACE_WITH_KUBESEAL_OUTPUT
    JWT_SECRET: REPLACE_WITH_KUBESEAL_OUTPUT
    STRIPE_API_KEY: REPLACE_WITH_KUBESEAL_OUTPUT
