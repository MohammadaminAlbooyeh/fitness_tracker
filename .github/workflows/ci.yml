name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  lint-python:
    name: Lint Python Services
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - user-service
          - product-service
          - cart-service
          - order-service
          - notification-service
          - analytics-service
          - behavior-tracking-service
          - recommendation-service
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Poetry
        run: pipx install poetry
      - name: Install shared lib
        run: |
          cd shared/python-common-lib
          poetry install
      - name: Lint service
        run: |
          cd services/${{ matrix.service }}
          poetry install --no-root
          poetry run ruff check . || true

  test-python:
    name: Test Python Services
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - user-service
          - product-service
          - cart-service
          - order-service
          - notification-service
          - analytics-service
          - behavior-tracking-service
          - recommendation-service
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: ecommerce
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Poetry
        run: pipx install poetry
      - name: Install shared lib
        run: |
          cd shared/python-common-lib
          poetry install
      - name: Install service
        run: |
          cd services/${{ matrix.service }}
          poetry install --no-root
      - name: Run tests with coverage
        run: |
          cd services/${{ matrix.service }}
          poetry run pytest tests/ -v --tb=short --cov=app --cov-report=xml --cov-report=term --cov-fail-under=60

  test-shared-lib:
    name: Test Python Shared Library
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: ecommerce
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Poetry
        run: pipx install poetry
      - name: Install shared lib
        run: |
          cd shared/python-common-lib
          poetry install
      - name: Run shared lib tests with coverage
        run: |
          cd shared/python-common-lib
          poetry run pytest tests/ -v --tb=short --cov=shared_lib --cov-report=xml --cov-report=term --cov-fail-under=60

  lint-java:
    name: Lint Java Services
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - payment-service
          - inventory-service
          - search-service
          - review-service
          - seller-service
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - name: Build shared lib
        run: |
          cd shared/java-common-lib
          mvn clean install -DskipTests
      - name: Lint service
        run: |
          cd services/${{ matrix.service }}
          mvn compile -q

  build-java:
    name: Build Java Services
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - payment-service
          - inventory-service
          - search-service
          - review-service
          - seller-service
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - name: Build shared lib
        run: |
          cd shared/java-common-lib
          mvn clean install -DskipTests
      - name: Build service
        run: |
          cd services/${{ matrix.service }}
          mvn clean test -q
      - name: Enforce JaCoCo coverage threshold
        run: |
          cd services/${{ matrix.service }}
          mvn jacoco:check -q

  build-docker:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs:
      - test-python
      - lint-java
      - build-java
    strategy:
      matrix:
        service:
          - user-service
          - product-service
          - cart-service
          - order-service
          - payment-service
          - inventory-service
          - search-service
          - review-service
          - seller-service
          - notification-service
          - analytics-service
          - behavior-tracking-service
          - recommendation-service
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args:
            SERVICE_PATH: services/${{ matrix.service }}
          push: false
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.service }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  terraform-validate:
    name: Terraform Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"
      - name: Terraform Init (dev)
        run: |
          cd infrastructure/terraform/dev
          terraform init -backend=false
      - name: Terraform Validate (dev)
        run: |
          cd infrastructure/terraform/dev
          terraform validate
      - name: Terraform Init (prod)
        run: |
          cd infrastructure/terraform/prod
          terraform init -backend=false
      - name: Terraform Validate (prod)
        run: |
          cd infrastructure/terraform/prod
          terraform validate
